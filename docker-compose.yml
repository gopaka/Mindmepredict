services:
  mindmepredict:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindmepredict
    restart: unless-stopped
    ports:
      # Map host port (default 8000 or 80 for direct public access) to container port 8000
      - "${HOST_PORT:-8000}:8000"
    environment:
      # Operator Credentials (defaults to admin / nifty2026 if not set in .env)
      - DESK_USERNAME=${DESK_USERNAME:-admin}
      - DESK_PASSWORD=${DESK_PASSWORD:-nifty2026}
      - DESK_FULLNAME=${DESK_FULLNAME:-Quant Risk Lead}
      # Optional 256-bit persistent secret key (auto-generated if omitted)
      - TERMINAL_SECRET_KEY=${TERMINAL_SECRET_KEY:-}
      # Path to store session state and persistent encryption keys
      - SECRET_KEY_PATH=/app/data/.secret_key
    volumes:
      # Named volume guarantees session secrets persist across container upgrades and reboots
      - mindme_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mindme_data:
    name: mindme_terminal_data

